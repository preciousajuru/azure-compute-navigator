<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title description">
  <title id="title">WordPress migration has separate decision boundaries</title>
  <desc id="description">Inventory an existing WordPress site on a VM with MariaDB. Evaluate App Service on Linux for compatible PHP hosting. Independently validate durable file storage and the database engine and migration. MySQL Flexible Server is only a candidate after MariaDB compatibility testing. Plan cutover and recovery for both files and database.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#0067c0"/></marker></defs>
  <rect width="760" height="520" rx="4" fill="#f5f6f8"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#20252c">
    <text x="28" y="38" font-size="22" font-weight="600">One site. Three decisions.</text>
    <g fill="#ffffff" stroke="#c6ced8">
      <rect x="170" y="65" width="420" height="70" rx="3"/>
      <rect x="170" y="198" width="420" height="82" rx="3"/>
      <rect x="28" y="350" width="330" height="100" rx="3"/>
      <rect x="402" y="350" width="330" height="100" rx="3"/>
    </g>
    <g stroke="#0067c0" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M380 135v54"/><path d="M290 280v30H193v31"/><path d="M470 280v30h97v31"/>
    </g>
    <g font-size="18" font-weight="600">
      <text x="188" y="94">Existing WordPress + MariaDB on a VM</text>
      <text x="188" y="228">Compute: App Service on Linux?</text>
      <text x="46" y="381">Persistent site files</text><text x="420" y="381">Database engine and location</text>
    </g>
    <g font-size="15" fill="#4a5564">
      <text x="188" y="119">Inventory runtime, extensions, plugins and state</text>
      <text x="395" y="171">Compatibility first</text>
      <text x="188" y="255">Candidate only if PHP, paths and networking fit</text>
      <text x="46" y="407">Uploads, plugin writes and shared paths</text><text x="46" y="432">Test restarts, deployments and scale-out</text>
      <text x="420" y="407">MySQL Flexible Server is a candidate</text><text x="420" y="432">Test MariaDB compatibility and restore</text>
      <text x="28" y="486">Plan connectivity, consistent backups, cutover and rollback across both dependencies.</text>
    </g>
  </g>
</svg>
